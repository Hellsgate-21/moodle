services:
  db:
    image: mariadb:11.4
    container_name: moodle_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: moodlerootpass
      MYSQL_DATABASE: moodle
      MYSQL_USER: moodleuser
      MYSQL_PASSWORD: moodlepass
    volumes:
      - moodle_db_data:/var/lib/mysql

  web:
    build: .
    container_name: moodle_web
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - db
    volumes:
      - .:/var/www/html
      - moodle_data:/var/www/moodledata

volumes:
  moodle_db_data:
  moodle_data: